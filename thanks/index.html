<style>

    --f-display:"Clash Display","Unbounded","Trebuchet MS",sans-serif;
    --f-body:"General Sans","Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ease:cubic-bezier(.16,1,.3,1);

  *{ box-sizing:border-box; margin:0; }
  body{

    color:var(--ink); font-family:var(--f-body); font-weight:500; font-size:1.05rem; line-height:1.55;

  .brand b{ color:var(--blue); font-weight:600; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--f-body); font-weight:600; font-size:.98rem; text-decoration:none; padding:14px 22px; border-radius:999px; border:1px solid transparent; cursor:pointer; transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease); }

  .btn-blue:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgba(143,228,255,0.4), 0 20px 50px -14px var(--glow); }
  .btn-ghost{ color:var(--ink); border-color:var(--line); background:rgba(160,210,255,0.04); }
  .btn-ghost:hover{ border-color:var(--blue); color:var(--blue-bright); }
  .btn-sm{ padding:10px 16px; font-size:.86rem; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:clamp(48px,10vh,110px) 0; }
  .card{ width:100%; max-width:560px; margin:0 auto; text-align:center; padding:clamp(30px,5vw,48px) clamp(22px,4vw,40px); border-radius:24px; border:1px solid rgba(47,178,255,0.6);
    background:radial-gradient(80% 140% at 0% 0%, rgba(47,178,255,0.16), transparent 60%), radial-gradient(60% 120% at 100% 100%, rgba(143,228,255,0.08), transparent 60%), #060a16;
    box-shadow:0 0 0 1px rgba(47,178,255,0.1), 0 0 80px -30px var(--glow); }
  .check{ width:64px; height:64px; margin:0 auto; border-radius:50%; display:grid; place-items:center; background:rgba(47,178,255,0.1); border:1px solid rgba(47,178,255,0.45); box-shadow:0 0 40px -10px var(--glow); }
  .check::before{ content:""; width:22px; height:11px; margin-top:-5px; border-left:3px solid var(--blue-bright); border-bottom:3px solid var(--blue-bright); transform:rotate(-45deg); }
  .label{ margin-top:22px; font-family:var(--f-mono); font-size:.78rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--blue-bright); }
  h1{ font-family:var(--f-display); font-weight:600; font-size:clamp(2.1rem,5.4vw,3.2rem); line-height:1.05; letter-spacing:-0.02em; margin-top:12px; text-wrap:balance; }
  .sub{ margin-top:16px; color:var(--ink-soft); font-size:clamp(1.02rem,1.6vw,1.12rem); text-wrap:pretty; }
  .sub b{ color:var(--ink); white-space:nowrap; }
  .card .btn{ margin-top:28px; width:100%; max-width:340px; }
  .back{ display:inline-block; margin-top:16px; font-size:.86rem; color:var(--ink-mute); text-underline-offset:3px; }
  .back:hover{ color:var(--blue-bright); }

  footer{ padding:24px 0 40px; border-top:1px solid var(--line-soft); font-size:.82rem; color:var(--ink-mute); }
  footer .contact{ display:flex; flex-wrap:wrap; gap:8px 18px; font-family:var(--f-mono); font-size:.74rem; letter-spacing:.04em; text-transform:uppercase; }
  footer .contact a{ text-decoration:none; }
  footer .contact a:hover{ color:var(--blue-bright); }

  :focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } .btn:hover{ transform:none; } }
</style>
